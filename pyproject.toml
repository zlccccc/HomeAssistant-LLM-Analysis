[project]
name = "homeassistant-llm-analysis"
version = "0.1.0"
description = "Home Assistant LLM Analysis Tool"
authors = [{ name = "zlc1114", email = "zlc1114@buaa.edu.cn" }]
dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "gradio>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "memu-py>=0.1.0",
    "loguru>=0.7.0",
]

requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
speech = [
    "pyaudio>=0.2.0",
    "pygame>=2.5.0",
    "pydub>=0.25.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=backend",
    "--cov=frontend",
    "--cov-config=pyproject.toml",
    "--cov-report=term-missing",
    "--cov-report=html:coverage/html",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-report=json:coverage/coverage.json",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_ha: marks tests that require Home Assistant connection",
    "requires_llm: marks tests that require LLM API connection",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Ruff configuration (fast linter)
[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
src = ["backend", "frontend", "test", "analyze_entities.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by black)
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "ARG001",  # unused function argument (for test fixtures)
    "ARG002",  # unused method argument
    "ERA001",  # ignore commented-out code detection for Chinese comments
    "RUF001",  # ignore full-width character detection in Chinese text
    "RUF002",  # ignore full-width character detection in Chinese docstrings
    "RUF003",  # ignore full-width character detection in Chinese comments
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["ARG001", "S101"]  # Allow asserts in tests
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Black configuration (code formatter)
[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pypackages__
)/
'''

# Coverage configuration
[tool.coverage.run]
source = ["backend", "frontend"]
data_file = "coverage/.coverage"
omit = [
    "*/__init__.py",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.json]
output = "coverage/coverage.json"

# MyPy configuration (type checker)
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "test/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "test_*"
disallow_untyped_defs = false